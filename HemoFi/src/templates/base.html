<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEMOSCAN</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
  <link href="/static/style.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>
  <div class="d-flex" id="wrapper">
    <nav id="sidebar">
      <div class="sidebar-header">
        <a href="/" class="sidebar-logo">🩸 <span>HEMOSCAN</span></a>
      </div>
      <ul class="nav flex-column sidebar-nav">
        <li class="nav-item">
          <a class="nav-link {% if request.path=='/' %}active{% endif %}" href="/">
            <span class="icon-badge icon-home"><i class="bi bi-house-fill"></i></span>
            <span class="nav-text">Home</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/patient') %}active{% endif %}" href="/patient">
            <span class="icon-badge icon-test"><i class="bi bi-thermometer-half"></i></span>
            <span class="nav-text">Test</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/dataset') %}active{% endif %}" href="/dataset">
            <span class="icon-badge icon-dataset"><i class="bi bi-bar-chart-fill"></i></span>
            <span class="nav-text">Dataset</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/assistant') %}active{% endif %}" href="/assistant">
            <span class="icon-badge icon-ai"><i class="bi bi-robot"></i></span>
            <span class="nav-text">AI</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/selfcheck') %}active{% endif %}" href="/selfcheck">
            <span class="icon-badge icon-test"><i class="bi bi-clipboard2-pulse-fill"></i></span>
            <span class="nav-text">SelfCheck</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/nutrition') %}active{% endif %}" href="/nutrition">
            <span class="icon-badge icon-dataset"><i class="bi bi-basket2-fill"></i></span>
            <span class="nav-text">Nutrition</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/faq') %}active{% endif %}" href="/faq">
            <span class="icon-badge icon-faq"><i class="bi bi-question-circle-fill"></i></span>
            <span class="nav-text">FAQ</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path.startswith('/about') %}active{% endif %}" href="/about">
            <span class="icon-badge icon-about"><i class="bi bi-info-circle-fill"></i></span>
            <span class="nav-text">About</span>
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <button class="theme-toggle-btn" id="themeToggle" title="Toggle theme">
          <span class="theme-icon">☀️</span>
        </button>
      </div>
    </nav>
    <div class="content flex-grow-1 p-4">
      {% block content %}{% endblock %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/script.js"></script>
</body>

</html>
